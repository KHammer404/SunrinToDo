name: Dispatch notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: dispatch-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: secrets
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$NEIS_API_KEY" ]; then
            echo "::notice::Skipping notification dispatch because required secrets are not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        if: steps.secrets.outputs.configured == 'true'
        working-directory: functions

      - run: npm run dispatch:notifications
        if: steps.secrets.outputs.configured == 'true'
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
